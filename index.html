<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>업다운 숫자 게임</title>
  <style>
    /* 디자인 기준: DESIGN-binance.md 토큰 (다크 캔버스 + 노란 강조 1색 + 상승/하락 초록·빨강) */
    :root {
      --primary: #fcd535;
      --primary-active: #f0b90b;
      --primary-disabled: #3a3a1f;
      --canvas: #0b0e11;
      --card: #1e2329;
      --elevated: #2b3139;
      --hairline: #2b3139;
      --body: #eaecef;
      --on-dark: #ffffff;
      --on-primary: #181a20;
      --muted: #707a8a;
      --muted-strong: #929aa5;
      --up: #0ecb81;
      --down: #f6465d;
      --focus-ring: rgba(59, 130, 246, 0.5);

      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-xl: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--canvas);
      color: var(--body);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "맑은 고딕", sans-serif;
      font-size: 20px;
      line-height: 1.5;
    }

    /* 숫자는 폭이 고른 숫자 글꼴로 */
    #guess-input,
    .status span {
      font-variant-numeric: tabular-nums;
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 32px 24px;
      background: var(--card);
      border-radius: var(--radius-xl);
      text-align: center;
    }

    h1 {
      margin: 0 0 4px;
      color: var(--on-dark);
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
    }

    .guide {
      margin: 0 0 24px;
      color: var(--muted);
    }

    #message {
      min-height: 3.4em; /* 화살표 + 두 줄 메시지가 들어가도 카드 높이가 흔들리지 않게 */
      margin: 0 0 24px;
      display: grid;
      align-content: center;
      place-items: center;
      color: var(--on-dark);
      font-size: 36px;
      font-weight: 700;
      line-height: 1.25;
      white-space: pre-line;
      word-break: keep-all;
    }
    #message.start { color: var(--body); font-size: 24px; font-weight: 600; }
    #message.up    { color: var(--up); }
    #message.down  { color: var(--down); }
    /* 업/다운 화살표는 메시지 위에 작게 올린다 */
    #message.up::before,
    #message.down::before {
      display: block;
      font-size: 24px;
      line-height: 1;
      margin-bottom: 4px;
    }
    #message.up::before   { content: "▲"; }
    #message.down::before { content: "▼"; }
    #message.win   { color: var(--primary); }
    #message.fail  { color: var(--on-dark); }
    #message.error { color: var(--muted-strong); font-size: 22px; font-weight: 600; }
    #message.pop   { animation: pop 0.6s ease-out; }

    @keyframes pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    #guess-form {
      display: flex;
      gap: 12px;
    }

    #guess-input {
      flex: 1;
      min-width: 0;
      height: 64px;
      padding: 0 16px;
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-lg);
      color: var(--on-dark);
      font: inherit;
      font-size: 32px;
      font-weight: 700;
      text-align: center;
    }
    #guess-input::-webkit-inner-spin-button,
    #guess-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    #guess-input::placeholder {
      color: var(--muted);
      font-size: 20px;
      font-weight: 400;
    }
    #guess-input:focus {
      outline: none;
      box-shadow: 0 0 0 2px var(--focus-ring);
    }

    button {
      height: 64px;
      padding: 0 24px;
      border: none;
      border-radius: var(--radius-md);
      font: inherit;
      font-size: 22px;
      font-weight: 600;
      cursor: pointer;
    }
    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--focus-ring);
    }

    #submit-btn {
      background: var(--primary);
      color: var(--on-primary);
    }
    #submit-btn:active:not(:disabled) { background: var(--primary-active); }
    #submit-btn:disabled {
      background: var(--primary-disabled);
      color: var(--muted);
      cursor: not-allowed;
    }
    #guess-input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #parity-hint {
      margin: 12px 0 0;
      padding: 12px 16px;
      background: var(--elevated);
      border-radius: var(--radius-lg);
      color: var(--on-dark);
      font-size: 22px;
      font-weight: 600;
    }
    #parity-hint::before {
      content: "힌트";
      margin-right: 12px;
      color: var(--primary);
    }

    .status {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin: 24px 0;
      border-top: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline);
    }
    .status span {
      padding: 16px 8px;
      color: var(--body);
      font-weight: 600;
    }
    .status span + span {
      border-left: 1px solid var(--hairline);
    }
    #remaining.low { color: var(--primary); }

    #restart-btn {
      width: 100%;
      height: 56px;
      background: var(--elevated);
      color: var(--on-dark);
    }
    #restart-btn:active { background: #363d47; }

    /* 축하 효과 */
    #confetti {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .confetti-piece {
      position: absolute;
      top: -20px;
      width: 10px;
      height: 16px;
      border-radius: 2px;
      animation: fall linear forwards;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); }
    }

    @media (max-width: 400px) {
      .card { padding: 24px 16px; }
      h1 { font-size: 26px; }
      #message { font-size: 30px; }
      #guess-input { font-size: 28px; }
      button { padding: 0 18px; }
      .status span { font-size: 18px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>업다운 숫자 게임</h1>
    <p class="guide">1 ~ 100 사이, 기회는 7번</p>

    <p id="message">1부터 100 사이의 숫자를 맞혀 보세요!</p>

    <form id="guess-form" novalidate>
      <input id="guess-input" type="number" min="1" max="100" placeholder="숫자 입력" autofocus>
      <button id="submit-btn" type="submit">확인</button>
    </form>

    <p id="parity-hint" hidden></p>

    <div class="status">
      <span id="attempts">시도 횟수: 0번</span>
      <span id="remaining">남은 기회: 7번</span>
    </div>

    <button id="restart-btn" type="button">다시 시작</button>
  </main>

  <script>
    const MAX_TRIES = 7;
    const HINT_AFTER_WRONG = 4;
    const START_MESSAGE = '1부터 100 사이의 숫자를 맞혀 보세요!';

    const form = document.getElementById('guess-form');
    const input = document.getElementById('guess-input');
    const submitBtn = document.getElementById('submit-btn');
    const messageEl = document.getElementById('message');
    const parityEl = document.getElementById('parity-hint');
    const attemptsEl = document.getElementById('attempts');
    const remainingEl = document.getElementById('remaining');
    const restartBtn = document.getElementById('restart-btn');

    let answer;
    let attempts;
    let guesses;
    let isOver;
    let isWin;
    let message;
    let messageType; // start | up | down | win | fail | error

    function startGame() {
      answer = Math.floor(Math.random() * 100) + 1;
      attempts = 0;
      guesses = [];
      isOver = false;
      isWin = false;
      message = START_MESSAGE;
      messageType = 'start';
      input.value = '';
      clearConfetti();
      render();
      input.focus();
    }

    function handleGuess(raw) {
      const text = raw.trim();
      if (text === '') {
        return showError('숫자를 입력하세요');
      }
      const num = Number(text);
      if (!Number.isInteger(num) || num < 1 || num > 100) {
        return showError('1부터 100 사이의 정수를 입력하세요');
      }
      if (guesses.includes(num)) {
        return showError(`이미 입력한 숫자예요 (${num})`);
      }

      guesses.push(num);
      attempts++;

      if (num === answer) {
        isOver = true;
        isWin = true;
        message = `정답입니다!\n(${attempts}번 만에 맞혔어요)`;
        messageType = 'win';
      } else if (attempts >= MAX_TRIES) {
        isOver = true;
        message = `실패! 정답은 ${answer}`;
        messageType = 'fail';
      } else if (num > answer) {
        message = '더 작은 수를 입력하세요';
        messageType = 'down';
      } else {
        message = '더 큰 수를 입력하세요';
        messageType = 'up';
      }
    }

    function showError(text) {
      message = text;
      messageType = 'error';
    }

    function render() {
      messageEl.textContent = message;
      messageEl.className = messageType;

      const remaining = MAX_TRIES - attempts;
      attemptsEl.textContent = `시도 횟수: ${attempts}번`;
      remainingEl.textContent = `남은 기회: ${remaining}번`;
      remainingEl.classList.toggle('low', remaining <= 2);

      const wrong = isWin ? attempts - 1 : attempts;
      const showParity = !isOver && wrong >= HINT_AFTER_WRONG;
      parityEl.hidden = !showParity;
      parityEl.textContent = showParity ? (answer % 2 === 0 ? '짝수예요' : '홀수예요') : '';

      input.disabled = isOver;
      submitBtn.disabled = isOver;
    }

    const CONFETTI_COLORS = ['#fcd535', '#f0b90b', '#0ecb81', '#eaecef'];
    const CONFETTI_COUNT = 80;
    const CONFETTI_MS = 3000;
    let confettiTimer = null;

    function celebrate() {
      clearConfetti();

      const layer = document.createElement('div');
      layer.id = 'confetti';
      for (let i = 0; i < CONFETTI_COUNT; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
        piece.style.animationDuration = `${1.8 + Math.random() * 0.7}s`;
        piece.style.animationDelay = `${Math.random() * 0.5}s`;
        layer.appendChild(piece);
      }
      document.body.appendChild(layer);
      confettiTimer = setTimeout(clearConfetti, CONFETTI_MS);

      // 같은 클래스를 다시 붙여도 애니메이션이 재생되도록 리플로우를 한 번 일으킨다
      messageEl.classList.remove('pop');
      void messageEl.offsetWidth;
      messageEl.classList.add('pop');
    }

    function clearConfetti() {
      clearTimeout(confettiTimer);
      confettiTimer = null;
      document.getElementById('confetti')?.remove();
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (isOver) return;
      handleGuess(input.value);
      render();
      if (isWin) celebrate();
      input.value = '';
      if (!isOver) input.focus();
    });

    restartBtn.addEventListener('click', startGame);

    startGame();
  </script>
</body>
</html>
